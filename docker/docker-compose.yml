services:
  postgresql:
    env_file:
      - ${DATA_PATH}/stack.env
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - internal

  server:
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - ${DATA_PATH}/stack.env
    environment:
      # Hardcoded service discovery — not secrets
      AUTHENTIK_POSTGRESQL__HOST: postgresql
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.10.3}
    restart: unless-stopped
    volumes:
      - media:/media
      - templates:/templates
    networks:
      - internal

  worker:
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - ${DATA_PATH}/stack.env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.10.3}
    restart: unless-stopped
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - media:/media
      - certs:/certs
      - templates:/templates
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    networks:
      - internal
    env_file:
      - ${DATA_PATH}/stack.env
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    depends_on:
      - server

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/db
  media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/media
  certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/certs
  templates:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/templates

networks:
  internal:
    # Internal network - no external access needed
    # Each stack gets its own isolated network
